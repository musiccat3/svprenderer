name: Build x86_64 VapourSynth + SVPflow 4.2.0.142

on:
  workflow_dispatch:
    inputs:
      svp_version:
        description: 'SVPflow version'
        required: true
        default: '4.2.0.142'
        type: choice
        options:
          - '4.2.0.142'
      build_type:
        description: 'Build type'
        required: true
        default: 'diagnostic'
        type: choice
        options:
          - 'diagnostic'
          - 'full'

jobs:
  build-x86_64:
    name: Build x86_64 VapourSynth + SVPflow
    runs-on: macos-14
    timeout-minutes: 60

    env:
      SVP_VERSION: ${{ github.event.inputs.svp_version }}
      BUILD_TYPE: ${{ github.event.inputs.build_type }}

    steps:
      - name: System Info
        run: |
          echo "=== Runner Architecture ==="
          uname -m
          arch
          sysctl -n machdep.cpu.brand_string
          echo ""
          echo "=== macOS Version ==="
          sw_vers
          echo ""
          echo "=== Available SDKs ==="
          ls /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/
          echo ""
          echo "=== Clang Version ==="
          clang --version

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download SVPflow 4.2.0.142
        run: |
          cd /tmp
          for i in {1..3}; do
            echo "Attempt $i to download SVPflow 4.2.0.142..."
            if curl -L --max-time 120 --retry 3 --retry-delay 5 -o svpflow-4.2.0.142.zip "https://web.archive.org/web/20190322064557/http://www.svp-team.com/files/gpl/svpflow-4.2.0.142.zip"; then
              echo "Download successful"
              break
            else
              echo "Attempt $i failed, retrying..."
              sleep 10
            fi
          done
          unzip -o svpflow-4.2.0.142.zip -d svpflow-4.2.0.142
          echo "=== SVPflow 4.2.0.142 macOS Libraries ==="
          file svpflow-4.2.0.142/svpflow-4.2.0.142/lib-macos/*.dylib
          echo ""
          echo "=== SVPflow 4.2.0.142 Library Symbols ==="
          for f in svpflow-4.2.0.142/svpflow-4.2.0.142/lib-macos/*.dylib; do
            echo "--- $f ---"
            nm -g "$f" | grep -E "SVSuper|SVAnalyse|SVSmoothFps|svp" | head -20
          done

      - name: Install x86_64 Homebrew to /usr/local
        run: |
          if [[ ! -x /usr/local/bin/brew ]]; then
            echo "Installing x86_64 Homebrew to /usr/local..."
            sudo mkdir -p /usr/local/Homebrew
            sudo chown -R $(whoami):admin /usr/local/Homebrew
            arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" < /dev/null
          fi
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Verify x86_64 Homebrew
        run: |
          if [[ -x /usr/local/bin/brew ]]; then
            echo "Found x86_64 Homebrew at /usr/local/bin/brew"
            arch -x86_64 /usr/local/bin/brew --version
          else
            echo "ERROR: x86_64 Homebrew not found at /usr/local/bin/brew"
            ls -la /usr/local/bin/brew 2>/dev/null || echo "No /usr/local/bin/brew"
            ls -la /opt/homebrew/bin/brew 2>/dev/null || echo "No /opt/homebrew/bin/brew"
            exit 1
          fi

      - name: Install Dependencies (x86_64)
        run: |
          arch -x86_64 /usr/local/bin/brew install --overwrite vapoursynth ffmpeg python@3.12
          arch -x86_64 /usr/local/bin/brew list --versions

      - name: Install SVPflow 4.2.0.142 Libraries
        run: |
          SVP_PLUGIN_DIR=$(arch -x86_64 /usr/local/bin/brew --prefix vapoursynth)/lib/vapoursynth
          echo "SVP Plugin Dir: $SVP_PLUGIN_DIR"
          mkdir -p "$SVP_PLUGIN_DIR"
          cp /tmp/svpflow-4.2.0.142/svpflow-4.2.0.142/lib-macos/libsvpflow1_vs64.dylib "$SVP_PLUGIN_DIR/"
          cp /tmp/svpflow-4.2.0.142/svpflow-4.2.0.142/lib-macos/libsvpflow2_vs64.dylib "$SVP_PLUGIN_DIR/"
          echo "=== Installed SVPflow Libraries ==="
          ls -la "$SVP_PLUGIN_DIR"/libsvpflow*
          file "$SVP_PLUGIN_DIR"/libsvpflow*

      - name: Diagnostic - VapourSynth Load Test
        run: |
          arch -x86_64 /usr/local/bin/vspipe --version
          arch -x86_64 /usr/local/bin/python3 .github/scripts/vapoursynth_load_test.py

      - name: Diagnostic - SVP Pipeline Test
        run: |
          arch -x86_64 /usr/local/bin/python3 .github/scripts/svp_pipeline_test.py

      - name: Full Render Test (30s clip @ 120fps)
        if: env.BUILD_TYPE == 'full'
        run: |
          arch -x86_64 /usr/local/bin/ffmpeg -f lavfi -i testsrc=duration=30:size=1920x1080:rate=30 -c:v libx264 -pix_fmt yuv420p /tmp/test_30s.mp4 -y
          arch -x86_64 /usr/local/bin/python3 .github/scripts/full_render_test.py

      - name: Package Artifacts
        if: env.BUILD_TYPE == 'full'
        run: |
          mkdir -p /tmp/artifact
          cp -r $(arch -x86_64 /usr/local/bin/brew --prefix vapoursynth) /tmp/artifact/
          mkdir -p /tmp/artifact/svpflow-4.2.0.142
          cp /tmp/svpflow-4.2.0.142/svpflow-4.2.0.142/lib-macos/*.dylib /tmp/artifact/svpflow-4.2.0.142/
          cp $(arch -x86_64 /usr/local/bin/brew --prefix ffmpeg)/bin/ffmpeg /tmp/artifact/
          mkdir -p /tmp/artifact/python
          cp -r $(arch -x86_64 /usr/local/bin/brew --prefix python@3.12)/lib/python3.12 /tmp/artifact/python/

      - name: Upload Artifacts
        if: env.BUILD_TYPE == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: svp-renderer-x86_64
          path: /tmp/artifact/
          retention-days: 7

      - name: Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Runner Architecture | $(uname -m) |" >> $GITHUB_STEP_SUMMARY
          echo "| VapourSynth Load | OK |" >> $GITHUB_STEP_SUMMARY
          echo "| SVPflow 4.2.0.142 Load | OK |" >> $GITHUB_STEP_SUMMARY
          echo "| SVP Pipeline (Super/Analyse/SmoothFps) | OK |" >> $GITHUB_STEP_SUMMARY
          echo "| Manager Required | No |" >> $GITHUB_STEP_SUMMARY
          echo "| Frames Generated | Verified |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts uploaded for download." >> $GITHUB_STEP_SUMMARY